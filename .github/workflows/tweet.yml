name: Tweet Daily Render

on:
  schedule:
    # Check every 30 minutes, away from the busy start of the hour.
    # The script uses rotating Europe/Paris hours (CET/CEST, same as Rome).
    # Delayed runs catch up after the target hour; posted pieces are skipped.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Post now (bypass target hour, preserve duplicate protection)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-x-post
  cancel-in-progress: false

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check whether posting is due
        id: check
        env:
          FORCE_TWEET: ${{ github.event.inputs.force }}
        run: |
          if [ "$FORCE_TWEET" = "true" ]; then
            python .github/scripts/tweet_art.py --check-only --force
          else
            python .github/scripts/tweet_art.py --check-only
          fi

      - name: Install System Dependencies
        if: steps.check.outputs.should_post == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install tweepy opencv-python-headless

      - name: Run X Automation Broadcast
        if: steps.check.outputs.should_post == 'true'
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          FORCE_TWEET: ${{ github.event.inputs.force }}
        run: |
          if [ "$FORCE_TWEET" = "true" ]; then
            python .github/scripts/tweet_art.py --force
          else
            python .github/scripts/tweet_art.py
          fi

      - name: Commit tweet record to repository
        if: steps.check.outputs.should_post == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add render_log.json
          git diff --staged --quiet || (git commit -m "chore: record tweet for daily render [skip ci]" && git push origin main)
